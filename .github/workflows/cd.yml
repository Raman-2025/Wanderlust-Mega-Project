name: cd

on:
  workflow_run:
    workflows: ["image build and push to ecr"]
    types: [completed]
    branches: [cicd]

jobs:
  deploy:
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
    - name: checkout repository
      uses: actions/checkout@v4

    - name: configure aws credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ vars.AWS_REGION }}

    - name: authentication
      run: aws eks update-kubeconfig --name eks-cluster-terra --region ${{ vars.AWS_REGION }}     


    - name: instructions for frontend deployment
      run: |
        echo "Deploying the latest images to the Kubernetes cluster..."
    
        echo "Updating frontend deployment..."
        kubectl set image deployment/frontend-deployment frontend=${{ vars.ECR_URL }}/wanderlust-frontend:latest -n wanderlust

        echo "restarting frontend deployment..."
        kubectl rollout restart deployment/frontend-deployment -n wanderlust

        echo "status of frontend deployment..."
        kubectl rollout status deployment/frontend-deployment -n wanderlust

    - name: insrtuctions for backend deployment
      run: |
        echo "Deploying the latest images to the Kubernetes cluster..."
    
        echo "Updating backend deployment..."
        kubectl set image deployment/backend-deployment backend=${{ vars.ECR_URL }}/wanderlust-backend:latest -n wanderlust

        echo "restarting backend deployment..."
        kubectl rollout restart deployment/backend-deployment -n wanderlust

        echo "status of backend deployment..."
        kubectl rollout status deployment/backend-deployment -n wanderlust      