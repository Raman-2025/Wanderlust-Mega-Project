apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: wanderlust

spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      name: frontend-pod
      labels:
        app: frontend

    spec:
      containers:
      - name: frontend
        image: raman20260/wanderlust-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5173

        env:
        - name: VITE_API_PATH
          value: "/api"

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: wanderlust
spec:
  selector:
    app: frontend
  ports:
  - protocol: TCP
    port: 5173
    targetPort: 5173
    nodePort: 31000
  type: NodePort  


